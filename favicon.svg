<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradientes de Marca -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>
    
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="50%" stop-color="#00b0ff" />
      <stop offset="100%" stop-color="#7d2ae8" />
    </linearGradient>

    <linearGradient id="candleGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#00b0ff" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa502" />
      <stop offset="100%" stop-color="#ff2a44" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo circular oscuro estilizado -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#neonGlow)" stroke-width="12" />
  
  <!-- Anillo exterior de datos / radar -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#212836" stroke-width="3" stroke-dasharray="8 6" />

  <!-- Velas japonesas de fondo (Trading context) -->
  <g opacity="0.45">
    <!-- Vela 1 -->
    <line x1="130" y1="200" x2="130" y2="340" stroke="#00e676" stroke-width="4" stroke-linecap="round" />
    <rect x="120" y="230" width="20" height="70" rx="3" fill="#00e676" />
    
    <!-- Vela 2 (Bajista) -->
    <line x1="180" y1="220" x2="180" y2="360" stroke="#ff2a44" stroke-width="4" stroke-linecap="round" />
    <rect x="170" y="250" width="20" height="60" rx="3" fill="#ff2a44" />

    <!-- Vela 3 (Alcista fuerte) -->
    <line x1="330" y1="160" x2="330" y2="320" stroke="#00e676" stroke-width="4" stroke-linecap="round" />
    <rect x="320" y="180" width="20" height="90" rx="3" fill="#00e676" />

    <!-- Vela 4 -->
    <line x1="380" y1="130" x2="380" y2="280" stroke="#00b0ff" stroke-width="4" stroke-linecap="round" />
    <rect x="370" y="150" width="20" height="80" rx="3" fill="#00b0ff" />
  </g>

  <!-- Curva de tendencia exponencial alcista (Glow) -->
  <path d="M 100 350 Q 230 330 310 220 T 420 130" fill="none" stroke="url(#neonGlow)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="420" cy="130" r="10" fill="#00e676" filter="url(#glow)" />

  <!-- MONOGRAMA CENTRAL "MK" MODERNO Y SÓLIDO -->
  <g filter="url(#glow)">
    <!-- Letra M -->
    <path d="M 145 370 L 145 160 L 210 275 L 275 160 L 275 370" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Letra K integrada en cyan/verde neón -->
    <path d="M 275 160 L 275 370 M 375 160 L 285 270 L 385 370" fill="none" stroke="url(#neonGlow)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Símbolo de Divisas / Crypto Node (Moneda / Nodo superior) -->
  <circle cx="210" cy="275" r="14" fill="#00e676" />
  <circle cx="210" cy="275" r="7" fill="#06080c" />
</svg>
